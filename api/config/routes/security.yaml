# Route de connexion : interceptée par le firewall `login` (json_login), jamais exécutée
# Sign-in route: intercepted by the `login` firewall (json_login), never executed
api_auth_login:
    path: /api/auth/login
    methods: [POST]

# Renouvellement et déconnexion : interceptés par le firewall `refresh`
# Refresh and sign-out: intercepted by the `refresh` firewall
api_auth_refresh:
    path: /api/auth/refresh
    methods: [POST]

api_auth_logout:
    path: /api/auth/logout
    methods: [POST]
