# Paramètres du framework Symfony (le secret vient de APP_SECRET)
# Symfony framework settings (secret comes from APP_SECRET)
framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    php_errors:
        log: true

# Active le client de test de WebTestCase uniquement en environnement de test
# Enables the WebTestCase test client in the test environment only
when@test:
    framework:
        test: true
