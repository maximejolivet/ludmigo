security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Hiérarchie des rôles : un administrateur peut tout ce que peut un gestionnaire de lieu, et un joueur
    # Role hierarchy: an administrator can do everything a venue manager and a player can
    role_hierarchy:
        ROLE_PLACE: ROLE_USER
        ROLE_ADMIN: [ROLE_PLACE, ROLE_USER]

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Connexion : email et mot de passe en JSON, réponse avec un JWT
        # Sign-in: email and password as JSON, answers with a JWT
        login:
            pattern: ^/api/auth/login$
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/auth/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        # Renouvellement du JWT et déconnexion (révoque le refresh token)
        # JWT renewal and sign-out (revokes the refresh token)
        refresh:
            pattern: ^/api/auth/(refresh|logout)$
            stateless: true
            provider: app_user_provider
            refresh_jwt:
                check_path: /api/auth/refresh
            logout:
                path: /api/auth/logout
        # Reste de l'API : JWT dans l'en-tête Authorization: Bearer
        # Rest of the API: JWT in the Authorization: Bearer header
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~

    # Seul le premier accès correspondant s'applique. Tout est privé sauf ce qui est listé ici.
    # Only the first matching rule is applied. Everything is private except what is listed here.
    access_control:
        - { path: ^/api/(health|auth/(register|login|refresh|logout))$, roles: PUBLIC_ACCESS }
        - { path: ^/api/?$, roles: '%app.docs_access%' }
        # Page Swagger et formats OpenAPI : voir app.docs_ui_access (interdits en production, même aux admins)
        # Swagger page and OpenAPI formats: see app.docs_ui_access (forbidden in production, admins included)
        - { path: '^/api/docs(/|\.html|\.jsonopenapi)?$', roles: '%app.docs_ui_access%' }
        - { path: ^/api/(docs|contexts)(\.|/|$), roles: '%app.docs_access%' }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
