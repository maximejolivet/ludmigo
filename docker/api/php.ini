memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 30

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; In production, code is baked into the image: no file check on every request
; En production, le code est figé dans l'image : pas de vérification des fichiers à chaque requête
opcache.validate_timestamps = 0
