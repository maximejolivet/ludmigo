server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fichiers versionnés par Vite : cache longue durée
    # Files versioned by Vite: long-lived cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application React Router : toutes les routes renvoient index.html
    # React Router app: every route returns index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
