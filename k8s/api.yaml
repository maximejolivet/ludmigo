# Backend Symfony (FrankenPHP).
# Symfony backend (FrankenPHP).
# Les secrets viennent du Secret "ludmigo-api" : APP_SECRET et DATABASE_URL.
# Secrets come from the "ludmigo-api" Secret: APP_SECRET and DATABASE_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ludmigo
  labels:
    app: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Remplacer par l'image publiée par la CI, avec un tag de version
          # Replace with the image published by CI, with a version tag
          image: ghcr.io/ORG/ludmigo-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: ludmigo-api
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ludmigo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
