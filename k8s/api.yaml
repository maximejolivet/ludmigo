# Backend Symfony (FrankenPHP).
# Symfony backend (FrankenPHP).
# Les secrets viennent du Secret "ludmigo-api" : APP_SECRET, DATABASE_URL et JWT_PASSPHRASE.
# Les clés JWT viennent du Secret "ludmigo-jwt", monté en lecture seule (jamais dans l'image).
# Secrets come from the "ludmigo-api" Secret: APP_SECRET, DATABASE_URL and JWT_PASSPHRASE.
# The JWT keys come from the "ludmigo-jwt" Secret, mounted read-only (never in the image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: ludmigo
  labels:
    app: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      # Aucun appel à l'API Kubernetes : pas de jeton de compte de service
      # No call to the Kubernetes API: no service account token
      automountServiceAccountToken: false
      # Sans root (www-data, uid 82 dans l'image) ; fsGroup donne accès en lecture aux clés JWT
      # Non-root (www-data, uid 82 in the image); fsGroup grants read access to the JWT keys
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Remplacer par l'image publiée par la CI, avec un tag de version
          # Replace with the image published by CI, with a version tag
          image: ghcr.io/ORG/ludmigo-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            # Système de fichiers en lecture seule : seuls /tmp, /data et /config (Caddy) sont inscriptibles
            # Read-only filesystem: only /tmp, /data and /config (Caddy) are writable
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: ludmigo-api
          env:
            - name: JWT_SECRET_KEY
              value: /app/config/jwt/private.pem
            - name: JWT_PUBLIC_KEY
              value: /app/config/jwt/public.pem
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/config/jwt
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: ludmigo-jwt
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
        - name: caddy-data
          emptyDir: {}
        - name: caddy-config
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: ludmigo
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
