# Migrations Doctrine, à lancer AVANT chaque déploiement de l'API.
# Doctrine migrations, to run BEFORE each API deployment.
# Ce Job n'est pas dans kustomization.yaml : il a un nom fixe et les Jobs sont immuables.
# This Job is not in kustomization.yaml: it has a fixed name and Jobs are immutable.
#
#   kubectl delete job api-migrate -n ludmigo --ignore-not-found
#   kubectl apply -f k8s/migrate-job.yaml
#   kubectl wait --for=condition=complete job/api-migrate -n ludmigo --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  namespace: ludmigo
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      # Aucun appel à l'API Kubernetes : pas de jeton de compte de service
      # No call to the Kubernetes API: no service account token
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Même tag que le Deployment "api" (api.yaml)
          # Same tag as the "api" Deployment (api.yaml)
          image: ghcr.io/ORG/ludmigo-api:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--env=prod"]
          # Seulement la connexion à la base : pas APP_SECRET ni JWT_PASSPHRASE
          # Only the database connection: no APP_SECRET or JWT_PASSPHRASE
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ludmigo-api
                  key: DATABASE_URL
            - name: APP_SECRET
              value: migration-only
