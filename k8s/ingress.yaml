# Routage public : /api vers le backend, le reste vers le web.
# Public routing: /api to the backend, everything else to the web app.
# Suppose un Ingress Controller nginx et cert-manager avec un ClusterIssuer "letsencrypt-prod".
# Assumes an nginx Ingress Controller and cert-manager with a "letsencrypt-prod" ClusterIssuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ludmigo
  namespace: ludmigo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ludmigo.fr
        - ludmigo.com
      secretName: ludmigo-tls
  rules:
    - host: ludmigo.fr
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
    - host: ludmigo.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
